services:
  - type: web
    name: peliculasya-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_URL
        value: https://peliculasya.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
  - type: web
    name: peliculasya
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://peliculasya-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
